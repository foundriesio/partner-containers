version: '3.2'

services:
    gst-ai-daisychain-detection-classification:
      image: hub.foundries.io/${FACTORY}/qimsdk-lmp:latest
      restart: always
      network_mode: "host"
      tty: true
      stop_grace_period: 5s
      command: /opt/gst-ai-daisychain-detection-classification --camera
      volumes:
        - /opt:/opt
